<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ef" />
    <title>tread | 車輪取得位置マップ</title>
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="https://use.typekit.net/rox8wlk.css">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-panel" aria-label="車輪取得位置の地図">
        <div id="map"></div>
        <div class="map-caption" aria-hidden="true">
          <span id="visible-count">36</span> 件の取得位置を表示中
        </div>
      </section>

      <aside class="index-panel">
        <header class="site-header">
          <div>
            <h1>tread</h1>
            <p>取得位置データ</p>
          </div>
          <span class="record-count">宇津野智成</span>
        </header>

        <label class="search-wrap" for="wheel-search">
          <span>車輪番号</span>
          <input
            id="wheel-search"
            type="search"
            inputmode="numeric"
            autocomplete="off"
            placeholder="番号を入力"
          />
        </label>

        <nav id="wheel-list" class="wheel-list" aria-label="車輪番号一覧"></nav>
        <p id="empty-state" class="empty-state" hidden>該当する車輪がありません。</p>
      </aside>
    </main>

    <noscript>この地図の表示にはJavaScriptが必要です。</noscript>
    <script src="vendor/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
